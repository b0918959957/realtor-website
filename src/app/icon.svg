<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A4E96" />
      <stop offset="55%" stop-color="#003C7D" />
      <stop offset="100%" stop-color="#002952" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8" />
      <stop offset="55%" stop-color="#D8A246" />
      <stop offset="100%" stop-color="#A87A25" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- 屋頂：呼應房仲身分 -->
  <path d="M14 30 L32 15 L50 30" fill="none" stroke="url(#gold)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- 飛：名字識別 -->
  <text x="32" y="49" text-anchor="middle"
        font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"
        font-size="26" font-weight="900" fill="url(#gold)">飛</text>
</svg>
